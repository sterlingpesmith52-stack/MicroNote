<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicroNote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
            background: #ffffff; /* pure white */
        }

        .logo {
            width: 64px;
            height: auto;
            display: block;
            margin-bottom: 8px;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 600;
            text-align: left;
        }

        .controls {
            margin-bottom: 8px;
        }

        button {
            padding: 8px 14px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #e0e0e0; /* microwidget gray */
            color: #000;
            text-align: left;
            width: auto;
        }

        textarea {
            width: 100%;
            height: 65vh;
            font-size: 18px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            background-color: #ffffff; /* pure white */
            -webkit-tap-highlight-color: transparent;
        }

        textarea:focus {
            outline: none;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <img src="IMG_1741.jpeg" class="logo">

    <h2>MicroNote</h2>

    <div class="controls">
        <button id="clearBtn">Clear</button>
    </div>

    <textarea id="noteBox" placeholder="Type your notes here..."></textarea>

    <script>
        const noteBox = document.getElementById("noteBox");
        const clearBtn = document.getElementById("clearBtn");

        /* Restore saved content */
        const saved = localStorage.getItem("microNoteContent");
        if (saved) {
            noteBox.value = saved;
        }

        /* Autosave */
        noteBox.addEventListener("input", () => {
            localStorage.setItem("microNoteContent", noteBox.value);
        });

        /* Clear */
        clearBtn.addEventListener("click", () => {
            noteBox.value = "";
            localStorage.removeItem("microNoteContent");
        });
    </script>

</body>
</html>
