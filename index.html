<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicroNote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
            background: #ffffff; /* pure white */
        }

        /* MicroFoundary header — stacked layout */
        .mf-header {
            display: flex;
            flex-direction: column;   /* stack logo + title */
            align-items: flex-start;  /* left aligned */
            margin-bottom: 16px;      /* space below header block */
        }

        .mf-header img {
            width: 140px;             /* correct readable size */
            height: auto;
            border-radius: 12px;      /* brand rounding */
            margin-bottom: 8px;       /* space between logo and title */
        }

        .mf-header-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;      /* padding beneath MicroNote (unchanged) */
        }

        .controls {
            margin-bottom: 8px;
        }

        button {
            padding: 8px 14px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #e0e0e0; /* microwidget gray */
            color: #000;
            text-align: left;
            width: auto;
        }

        textarea {
            width: 100%;
            height: 65vh;
            font-size: 18px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        textarea:focus {
            outline: none;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <!-- MicroFoundary header -->
    <div class="mf-header">
        <img src="IMG_1741.jpeg" alt="MicroFoundary Logo">
        <div class="mf-header-title">MicroNote</div>
    </div>

    <div class="controls">
        <button id="clearBtn">Clear</button>
    </div>

    <textarea id="noteBox" placeholder="Type your notes here..."></textarea>

    <script>
        const noteBox = document.getElementById("noteBox");
        const clearBtn = document.getElementById("clearBtn");

        /* Restore saved content */
        const saved = localStorage.getItem("microNoteContent");
        if (saved) {
            noteBox.value = saved;
        }

        /* Autosave */
        noteBox.addEventListener("input", () => {
            localStorage.setItem("microNoteContent", noteBox.value);
        });

        /* Clear */
        clearBtn.addEventListener("click", () => {
            noteBox.value = "";
            localStorage.removeItem("microNoteContent");
        });
    </script>

</body>
</html>
