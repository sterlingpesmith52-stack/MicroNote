<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicroNote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
            background: #fafafa;
        }

        textarea {
            width: 100%;
            height: 70vh;
            font-size: 18px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
        }

        button {
            margin-top: 12px;
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #e74c3c;
            color: white;
        }
    </style>
</head>

<body>

    <h2>MicroNotes</h2>

    <textarea id="noteBox" placeholder="Type your notes here..."></textarea>

    <button id="clearBtn">Clear Notes</button>

    <script>
        const noteBox = document.getElementById("noteBox");
        const clearBtn = document.getElementById("clearBtn");

        // Load saved note on startup
        const saved = localStorage.getItem("microNotesContent");
        if (saved) {
            noteBox.value = saved;
        }

        // Auto-save on every keystroke
        noteBox.addEventListener("input", () => {
            localStorage.setItem("microNotesContent", noteBox.value);
        });

        // Clear button
        clearBtn.addEventListener("click", () => {
            noteBox.value = "";
            localStorage.removeItem("microNotesContent");
        });
    </script>

</body>
</html>
