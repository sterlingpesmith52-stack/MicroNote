<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicroNote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
            font-family: sans-serif;
            background: #ffffff;
        }

        /* MicroFoundary Header */
        .mf-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .mf-header img {
            width: 140px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .mf-header-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            padding: 8px 14px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #clearBtn {
            background: #000000;
            color: #ffffff;
        }

        #copyBtn {
            background: #0078D4;
            color: #ffffff;
        }

        textarea {
            width: 100%;
            height: 58vh;
            font-size: 18px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 6px;
            resize: none;
            background: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        textarea:focus {
            outline: none;
            border-color: #cccccc;
        }

        /* Fixed Footer */
        .buy-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            border-top: 1px solid #dddddd;
            padding: 12px;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
        }

        .buy-btn {
            width: auto;
            background: #0078D4;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="mf-header">
        <img src="IMG_1741.jpeg" alt="MicroFoundary Logo">
        <div class="mf-header-title">MicroNote</div>
    </div>

    <div class="controls">
        <button id="clearBtn">Clear</button>
        <button id="copyBtn">Copy</button>
    </div>

    <textarea
        id="noteBox"
        placeholder="Type your notes here..."
    ></textarea>

    <div class="buy-footer" id="buyFooter">
        <button class="buy-btn">Buy This Tool</button>
    </div>

    <script>
        const noteBox = document.getElementById("noteBox");
        const clearBtn = document.getElementById("clearBtn");
        const copyBtn = document.getElementById("copyBtn");
        const buyFooter = document.getElementById("buyFooter");

        /* Restore saved note */
        const saved = localStorage.getItem("microNoteContent");

        if (saved) {
            noteBox.value = saved;
        }

        /* Autosave */
        noteBox.addEventListener("input", () => {
            localStorage.setItem(
                "microNoteContent",
                noteBox.value
            );
        });

        /* Clear */
        clearBtn.addEventListener("click", () => {
            noteBox.value = "";
            localStorage.removeItem("microNoteContent");
        });

        /* Copy */
        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(
                    noteBox.value
                );

                const original = copyBtn.textContent;
                copyBtn.textContent = "Copied";

                setTimeout(() => {
                    copyBtn.textContent = original;
                }, 1200);

            } catch (err) {
                alert("Unable to copy text.");
            }
        });

        /* Hide footer while keyboard is open */
        noteBox.addEventListener("focus", () => {
            buyFooter.style.display = "none";
        });

        noteBox.addEventListener("blur", () => {
            buyFooter.style.display = "flex";
        });
    </script>

</body>
</html>
