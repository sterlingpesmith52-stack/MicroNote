<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicroNote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
            background: #f0f0f0; /* standard microwidget gray */
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            font-weight: 600;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 70vh;
            font-size: 18px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            background-color: #ffffff; /* pure white input area */
        }

        button {
            margin-top: 12px;
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #e0e0e0; /* microwidget gray button */
            color: #000;
            text-align: left;
            width: auto; /* auto-width per your style */
        }
    </style>
</head>

<body>

    <h2>MicroNote</h2>

    <textarea id="noteBox" placeholder="Type your notes here..."></textarea>

    <button id="clearBtn">Clear</button>

    <script>
        const noteBox = document.getElementById("noteBox");
        const clearBtn = document.getElementById("clearBtn");

        // Load saved note on startup
        const saved = localStorage.getItem("microNoteContent");
        if (saved) {
            noteBox.value = saved;
        }

        // Auto-save on every keystroke
        noteBox.addEventListener("input", () => {
            localStorage.setItem("microNoteContent", noteBox.value);
        });

        // Clear button
        clearBtn.addEventListener("click", () => {
            noteBox.value = "";
            localStorage.removeItem("microNoteContent");
        });
    </script>

</body>
</html>
