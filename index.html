<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroNote</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#ffffff;
    color:#111;
    max-width:700px;
    margin:0 auto;
    padding:12px;
    padding-bottom:90px;
}

.logo{
    width:70px;
    display:block;
    margin-bottom:4px;
}

h1{
    font-size:24px;
    font-weight:700;
    line-height:1;
    margin-bottom:4px;
}

.subtitle{
    font-size:14px;
    color:#666;
    line-height:1.25;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:65vh;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    resize:vertical;
    font-size:16px;
    line-height:1.5;
}

.button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

button{
    background:#0078D4;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
}

button:hover{
    opacity:.9;
}

.secondary-btn{
    background:#111111;
}

.status{
    margin-top:8px;
    font-size:13px;
    color:#666;
}

.char-count{
    margin-top:2px;
    font-size:11px;
    color:#777;
}

.footer{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
}

.buy-btn{
    background:#0078D4;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px 24px;
    font-size:14px;
    font-weight:700;
    width:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}
</style>
</head>
<body>

<img src="IMG_1741.jpeg" alt="MicroFoundary Logo" class="logo">

<h1>MicroNote</h1>

<p class="subtitle">
Capture thoughts instantly. Notes save automatically.
</p>

<textarea id="noteBox" placeholder="Start typing..."></textarea>

<div class="button-row">
    <button onclick="saveNote()">Save</button>
    <button class="secondary-btn" onclick="clearNote()">Clear</button>
    <button onclick="copyNote()">Copy</button>
</div>

<div class="status" id="status">
Ready
</div>

<div class="char-count" id="charCount">
0 characters
</div>

<div class="footer" id="footer">
    <button class="buy-btn">
        Buy This Tool
    </button>
</div>

<script>
const noteBox = document.getElementById('noteBox');
const status = document.getElementById('status');
const footer = document.getElementById('footer');
const charCount = document.getElementById('charCount');

function updateCharCount(){
    charCount.textContent = noteBox.value.length + ' characters';
}

window.addEventListener('load', () => {
    const saved = localStorage.getItem('micronote');

    if(saved){
        noteBox.value = saved;
    }

    updateCharCount();
});

function saveNote(){
    localStorage.setItem('micronote', noteBox.value);
    status.textContent = 'Saved ✓';
    updateCharCount();
}

function clearNote(){
    if(confirm('Delete note?')){
        noteBox.value = '';
        localStorage.removeItem('micronote');
        status.textContent = 'Cleared';
        updateCharCount();
    }
}

function copyNote(){
    navigator.clipboard.writeText(noteBox.value);
    status.textContent = 'Copied ✓';
}

noteBox.addEventListener('input', () => {
    localStorage.setItem('micronote', noteBox.value);
    status.textContent = 'Auto-saved ✓';
    updateCharCount();
});

noteBox.addEventListener('focus', () => {
    footer.style.display = 'none';
});

noteBox.addEventListener('blur', () => {
    footer.style.display = 'block';
});
</script>

</body>
</html>
